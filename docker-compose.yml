services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rebyte
      POSTGRES_PASSWORD: rebyte
      POSTGRES_DB: rebyte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  postgres_data:
